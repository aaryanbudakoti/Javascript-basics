<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body style = "background-color: black  ; color: white ; font-family: Arial, Helvetica, sans-serif;">

<script>
    // console.log("Hello, World!");
    const div = document.createElement("div") // <div></div>
    // console.log(div) // <div></div>
    // div.innerHTML = "This is a div element"
    // console.log(div) // <div>This is a div element</div>
    div.className = "my-div"
    div.id = Math.round(Math.random()*10+1)
    console.log(div) // <div class="my-div" id="6">This is a div element</div>



    div.setAttribute("title", "Generated Div")
    div.style.backgroundColor = "pink"
    div.style.padding = "10px"
    // div.innerHTML = "This is a div element"
    // document.body.appendChild(div) // <body>...<div class="my-div"
    // appendChild is used to add a child element to a parent element, in this case we are adding the div element as a child of the body element.
    
    const addText = document.createTextNode("This is a text node") // #text "This is a text node"
    div.appendChild(addText) // <div class="my-div" id="6">This is a div element #text "This is a text node"</div>
    document.body.appendChild(div) // <body>...<div class="my-div" id 

    // console.log(document.body) // <body style="background-color: black; color: white; font-family: Arial, Helvetica, sans-serif;">...<div class="my-div" id="6" title="Generated Div" style="background-color: pink; padding: 10px;">This is a text node</div></body>
   </script>
