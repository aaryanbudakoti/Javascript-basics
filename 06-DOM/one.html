 <!-- What is DOM?  -->
<!-- Document Object Model -->
<!-- It is a programming interface for HTML and XML documents. It represents the page so that programs can change the document structure, style, and content. The DOM represents the document as nodes and objects. That way, programming languages can interact with the page. -->
<!-- It is a standard object model and programming interface for HTML. It defines the logical structure of documents and the way a document is accessed and manipulated. -->
