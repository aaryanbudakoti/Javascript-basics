 <!-- What is DOM?  -->
<!-- Document Object Model -->
<!-- It is a programming interface for HTML and XML documents. It represents the page so that programs can change the document structure, style, and content. The DOM represents the document as nodes and objects. That way, programming languages can interact with the page. -->
<!-- It is a standard object model and programming interface for HTML. It defines the logical structure of documents and the way a document is accessed and manipulated. -->

<!-- html collection and node list -    
HTMLCollection and NodeList are both collections of DOM nodes, but they have some differences:
1. HTMLCollection: It is a live collection of DOM elements. It is automatically updated when the document changes. It is returned by methods like getElementsByClassName() and getElementsByTagName().
2. NodeList: It is a static collection of DOM nodes. It is not automatically updated when the document changes. It is returned by methods like querySelectorAll() and child Nodes. -->
